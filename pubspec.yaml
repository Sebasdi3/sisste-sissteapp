name: sisste_app
description: "SISSTeApp — Aplicación móvil del Sistema Interno para la Solicitud de Soporte Técnico (SISSTe). SUNDDE."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Cliente HTTP con timeouts configurables e interceptores.
  # Se usa Dio en vez de http porque necesitamos control fino de
  # connectTimeout/receiveTimeout para tolerar redes lentas (3G),
  # tal como se discutió para SISSTeApp.
  dio: ^5.4.3+1

  # El backend usa sesión por cookie (express-session): estas dos
  # librerías guardan y reenvían la cookie `connect.sid` en cada
  # petición, y path_provider da la carpeta privada de la app donde
  # persistirla para que la sesión sobreviva al cerrar la app.
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.3

  # Almacenamiento seguro de los datos de sesión en el dispositivo
  # (Keystore en Android / Keychain en iOS), exigido por RNF-APP-01.
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.2.4
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
